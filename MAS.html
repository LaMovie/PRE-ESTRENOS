<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="referrer" content="no-referrer">
     <title> PROJECT </title>
<style>
body {    
    background: #000016;    
}
#Lista {
    gap: 12px;
    padding: 0px;  
    display: grid;
    list-style: none;
    font-weight: bold;    
    grid-template-columns: repeat(3, 1fr);
}
#Lista li {
    margin-left: 0vh;
    color: gold;
    width: 13vh;
    height: 13vh;
    display: flex;
    background: #001;    
    border-radius: 20px;    
    align-items: center;
    justify-content: center;    
   
   &:hover {
     color: #4f9;
 }
}
a {
    color: inherit; 
 /* Hereda El Color Del Padre */
    cursor: none;
    text-decoration: none;
}
#F {
    width: 100%;
    height: 30vh;
    margin-top: 3vh;
    aspect-ration: 6/19;
    border-radius: 20px;
    border: .5px solid #aaa;
    background: url(https://is.gd/DSiGA7);
    background-size: cover;
    background-position: center;
}
#H {
    color: gray;
}
</style>
</head>
<body>
<center>
    <iframe id="F" src="" frameborder="1" allowfullscreen="true" allow="encrypted-media" allow="autoplay"></iframe>    
        
      <h4 id="H">2026</h4>
       <ul id="Lista"></ul>
              
</center>
<script>
 var CH = [
  {name: "PROYECTO FIN DEL MUNDO", url: "https://media-cache-node.asia/embed/687163"}
 ];

 CH.forEach(canal => {
    let li = document.createElement('li');
    li.innerHTML = `<a class="DATA" href="${canal.url}">${canal.name}</a>`;
    Lista.appendChild(li);  
 });


    var LIST = document.querySelectorAll('#Lista li');
    
 LIST.forEach(lis => {
   lis.onclick = (e) => {    
     e.preventDefault();  
       LIST.forEach(other => {
   other.style.border = '';
  other.style.color = 'gold'; 
  other.style.background = '#001';
      });
 var Enlace = e.target.href;
 var Titulo = e.target.textContent;
     lis.style.color = '#4f3';
  lis.style.background = '#000';
lis.style.borderTop = '1px solid #4f3';
lis.style.borderBottom = '.1px solid #4f3';
   
   if (Enlace.includes('dropbox.com')) {
         var URL = Enlace.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        F.src = URL;
        
      } else if (Titulo.includes('🔗')) {
   Titulo = '⏳Espere...';  
   e.target.textContent = Titulo; 
  setTimeout(() => {
     window.location.href = Enlace;
  }, 2000);
          
      } else {
          F.src = Enlace;
      }
        H.textContent = Titulo;
    }
 })
</script>
         <!-- texto -->
<script>
window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
           var textCapt = params.get('texto');
  
        if (textCapt) {
     var enlaces = document.querySelectorAll('#Lista li a');     
    
    enlaces.forEach(a => {
      var Clean = a.textContent.trim().toLowerCase().replace('🔗', '');  
      
        if (Clean === textCapt.trim().toLowerCase()) {
        a.click(); 
      }
    });
  }
});
</script>      
</body>
</html>
