<style>
body {    
    background: #000016;    
}
#Lista {
    gap: 12px;
    padding: 0px;  
    margin: 0 auto;
    display: grid;
    list-style: none;
    font-weight: bold;    
    grid-template-columns: repeat(3, 1fr); 
    justify-content: center; 
    justify-items: center;   
}
#Lista li {
    color: orange;
    width: 13vh;
    height: 13vh;
    display: flex;
    background: #001;    
    border-radius: 20px;    
    align-items: center;
    justify-content: center;    
   
   &:hover {
     color: #4f9;
 }
}
a {
    color: inherit; 
 /* Hereda El Color Del Padre */
    cursor: none;
    text-decoration: none;    
}
#F {
    width: 100%;
    height: 30vh;
    margin-top: 3vh;
    aspect-ration: 6/19;
    border-radius: 20px;
    border: .5px solid #aaa;
    background: url(https://is.gd/DSiGA7);
    background-size: cover;
    background-position: center;
}
#H {
    color: gray;
}
.active {
    background: #000;
    border-top: 1px solid #4f3;
    border-bottom: .1px solid #4f3;    
}
.active a {
    color: #4f3;
}

@media (min-width: 500px) {
     #F {
         width: auto;
         height: 60vh;
         min-width: 45%;
     }
 }

</head>
<body>
<center>
    <iframe id="F" src="" frameborder="1" allowfullscreen="true" allow="encrypted-media" allow="autoplay"></iframe>    
        
      <h4 id="H">2027</h4>
       <ul id="Lista"></ul>
              
</center>
<script>
 var CH = [
  {name: "WERWULF🔴", url: "https://www.youtube.com/watch?v=CnGQAzXCgKM"}, 
  {name: "BLADE RUNNER 2099🔴", url: "https://www.youtube.com/watch?v=9vnSsgTMoyo"}, 
  {name: "LA MANGOSTA🔴", url: "https://www.youtube.com/watch?v=VicYdglGsjc"}, 
  {name: "SACRIFICIO🔴", url: "https://www.youtube.com/watch?v=22n8bvEpDrc"}, 
  {name: "LA CAIDA DE LA BALLENA🔴", url: "https://www.youtube.com/watch?v=6fPkAv0kDvo"}, 
  {name: "DOOMSDAY🔴", url: "https://www.youtube.com/watch?v=lAr_uspgHm8"} 
 ];

 CH.forEach(canal => {
    let li = document.createElement('li');
    li.innerHTML = `<a class="DATA" href="${canal.url}">${canal.name}</a>`;
    Lista.appendChild(li);  
 });


    var LIST = document.querySelectorAll('#Lista li');
    
 LIST.forEach(lis => {
    lis.onclick = (e) => {    
       e.preventDefault();  
  LIST.forEach(other => other.classList.remove('active'));
  lis.classList.add('active');
   
 var Enlace = lis.querySelector('a').href;
 var Titulo = lis.querySelector('a').textContent.replace('🔴', '');     
   
   if (Enlace.includes('youtube')) {
         var URL = Enlace.replace('youtube', 'yout-ube');
        F.src = URL;
        
      } else if (Titulo.includes('🔗')) {
   Titulo = '⏳Espere...';  
   lis.querySelector('a').textContent = Titulo; 
  setTimeout(() => {
     window.location.href = Enlace;
  }, 2000);
          
      } else {
          F.src = Enlace;
      }
        H.textContent = Titulo;
     F.style.background = 'url(https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEinuR3l58e9MiWP_hDFssCF5NqAMMhF-rPxTJychbQR8ViB2Y2msjtuYetE3Apf43IQe_mqNG5_8I-HKQbkf-GvRtenXE5fDLEH8kn0wmvBX7MBwtFIvHusDIsB14x1XdAYcay-AqPgXamUKOYE2JVKUEkO1if0bBhsYrpZL1qbpqw5UDhNubuehQzMgng/s498/image_downloader_1700646861820.gif)';
    }
 });
</script>

         <!-- texto -->
<script>
window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
           var textCapt = params.get('texto');
           
        if (textCapt) {
     var enlaces = document.querySelectorAll('#Lista li a');     
    
    enlaces.forEach(a => {
      var Clean = a.textContent.trim().toLowerCase().replace('🔗', '');  
      
        if (Clean === textCapt.trim().toLowerCase()) {
        a.click(); 
      }
    });  
  
 } else if (params.has('index')) {
  var enlaces = document.querySelectorAll('#Lista li a');     
      
   var R = Math.floor(Math.random() * enlaces.length);
      enlaces[R].click();     
  }
});
</script>      
</body>
